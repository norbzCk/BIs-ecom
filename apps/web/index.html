<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#04050a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="Billionare — premium workstations, ultra-wide monitors, mechanical keyboards and performance mice. Engineered for digital power users."
    />
    <title>Billionare — Premium Workstation Hardware</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Pre-hydration theme + splash. Resolves the stored/system theme and
         paints the matching canvas before React mounts, so there is no white
         flash in dark mode and no dark flash in light mode. */
      html {
        background: #04050a;
      }
      html.light {
        background: #f6f7fb;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #04050a;
        z-index: 9999;
        transition:
          opacity 0.5s ease,
          visibility 0.5s ease,
          background-color 0.35s ease;
      }
      html.light #boot {
        background: #f6f7fb;
      }
      #boot[data-done='true'] {
        opacity: 0;
        visibility: hidden;
      }
      #boot .bar {
        width: 132px;
        height: 2px;
        border-radius: 99px;
        background: #151a2c;
        overflow: hidden;
      }
      html.light #boot .bar {
        background: #e8ebf3;
      }
      #boot .bar::after {
        content: '';
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 99px;
        background: linear-gradient(90deg, #4557e6, #38d6ee);
        animation: boot-slide 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(360%);
        }
      }
    </style>
    <script>
      /* Resolves the theme and applies it before first paint. Lives in its own
         script tag (not inside <style>) so the CSS minifier doesn't try to
         parse it, and runs before the module bundle to avoid a theme flash. */
      ;(function () {
        try {
          var stored = localStorage.getItem('billionare:theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.classList.toggle('light', theme === 'light')
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          /* storage blocked — the dark default in the CSS already applies */
        }
      })()
    </script>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading Billionare">
      <div class="bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
